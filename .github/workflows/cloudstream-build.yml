name: CloudStream build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*/src/**"
      - "shared/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/cloudstream-build.yml"
      - "center.json"
      - "singoli.json"

permissions:
  contents: write

concurrency:
  group: cloudstream-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build plugins
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon make makePluginsJson
          ./gradlew --no-daemon ensureJarCompatibility
          mkdir -p ../out
          cp **/build/*.cs3 ../out/
          cp **/build/*.jar ../out/ || true
          cp build/plugins.json ../out/
          python3 - <<'PY'
          import json
          plugins = json.load(open("../out/plugins.json"))
          center = [p for p in plugins if p["internalName"] in ("PriSynx", "RaiPlay", "PriSynxLive")]
          single = [p for p in plugins if p["internalName"] != "PriSynx"]
          json.dump(center, open("../out/plugins-center.json", "w"), indent=2, ensure_ascii=False)
          json.dump(single, open("../out/plugins-singoli.json", "w"), indent=2, ensure_ascii=False)
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cs3
          path: out/

      - name: Publish builds branch
        if: github.ref == 'refs/heads/main'
        working-directory: src
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add --detach ../publish
          cd ../publish
          git checkout --orphan builds
          git rm -rf . >/dev/null 2>&1 || true
          cp -r ../out/. .
          git add -A
          git commit -m "CloudStream build ${GITHUB_SHA}" || exit 0
          git push --force origin HEAD:builds
